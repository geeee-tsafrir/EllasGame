import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

plugins {
    id "com.android.application"
}

base {
    archivesName = "EllasGame"
}

android {
    namespace = "com.ellasgame.android"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.ellasgame"
        minSdk = 23
        targetSdk = 36
        versionCode = 1
        versionName = "0.1.0"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

}

abstract class CopySharedAssetsTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getSourceDirectory()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void copyAssets() {
        project.sync {
            from(sourceDirectory.dir("icons")) {
                include("*-steampunk.png")
                rename { fileName -> fileName.replace("-", "_") }
                into("drawable")
            }
            into(outputDirectory)
        }
    }
}

def copySharedIcons = tasks.register("copySharedIcons", CopySharedAssetsTask) {
    group = "build"
    description = "Copy shared image assets into the Android resource layout."

    sourceDirectory.set(rootProject.layout.projectDirectory.dir("assets"))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res?.addGeneratedSourceDirectory(copySharedIcons) {
            it.outputDirectory
        }
    }
}

dependencies {
    implementation project(":core")

    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.camera:camera-camera2:1.5.3"
    implementation "androidx.camera:camera-lifecycle:1.5.3"
    implementation "androidx.camera:camera-view:1.5.3"
}
