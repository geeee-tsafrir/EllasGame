plugins {
    id "java"
    id "com.android.application" version '9.2.1' apply false
}

allprojects {
    group = "com.ellasgame"
    version = "0.1.0"
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = "UTF-8"
        }
    }
}
